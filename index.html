<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Slanya - Need Help?</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 8px;
    text-align: center;
  }
  p.sub {
    color: #9aa0aa;
    text-align: center;
    margin-bottom: 28px;
    font-size: 0.95rem;
  }
  #main-view { width: 100%; max-width: 400px; }
  .btn {
    width: 100%;
    padding: 20px;
    margin-bottom: 14px;
    border: 2px solid transparent;
    border-radius: 14px;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: transform 0.1s, border-color 0.15s;
    background: #1b1e26;
    color: #fff;
  }
  .btn:active { transform: scale(0.97); }
  .btn.selected { border-color: #fff; }
  .checkin .icon { color: #3874d6; }
  .unsafe .icon { color: #e0334d; }
  .ride .icon { color: #f2b705; }
  .icon { font-size: 1.5rem; }
  .btn-label { display: flex; flex-direction: column; }
  .btn-label small {
    font-weight: 400;
    color: #9aa0aa;
    font-size: 0.8rem;
    margin-top: 2px;
  }

  textarea {
    width: 100%;
    background: #1b1e26;
    color: #fff;
    border: 1px solid #2c303a;
    border-radius: 10px;
    padding: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    resize: none;
    margin-bottom: 20px;
    margin-top: 4px;
  }
  textarea::placeholder { color: #6b7280; }
  label.optional {
    font-size: 0.85rem;
    color: #9aa0aa;
    display: block;
    margin-bottom: 4px;
  }

  #send-btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 14px;
    background: #e0334d;
    color: #fff;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
  }
  #send-btn:disabled {
    background: #3a3d45;
    color: #7a7d85;
    cursor: not-allowed;
  }

  #confirmation {
    display: none;
    text-align: center;
    max-width: 400px;
  }
  #confirmation h2 { font-size: 1.5rem; margin-bottom: 12px; }
  #confirmation p { color: #cfd3da; font-size: 1rem; }

  #error {
    display: none;
    color: #ffb3b3;
    text-align: center;
    margin-top: 16px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div id="main-view">
  <h1>Need help?</h1>
  <p class="sub">Select an option. Staff will be alerted right away.</p>

  <button class="btn checkin" data-type="Check-in" onclick="selectType(this, 'Check-in')">
    <span class="icon">🔵</span>
    <span class="btn-label">I need a staff check-in<small>Low urgency — someone come find me</small></span>
  </button>
  <button class="btn unsafe" data-type="Unsafe" onclick="selectType(this, 'Unsafe')">
    <span class="icon">🔴</span>
    <span class="btn-label">I feel unsafe right now<small>Immediate response needed</small></span>
  </button>
  <button class="btn ride" data-type="Safe ride home" onclick="selectType(this, 'Safe ride home')">
    <span class="icon">🟡</span>
    <span class="btn-label">I need a safe way home<small>Help me get home safely</small></span>
  </button>

  <label class="optional" for="note">Optional — add a detail (e.g. "at the bar, red dress")</label>
  <textarea id="note" rows="2" maxlength="120" placeholder="Nothing required — leave blank if you'd rather not say"></textarea>

  <button id="send-btn" disabled onclick="sendAlert()">Send alert</button>

  <div id="error"></div>
</div>

<div id="confirmation">
  <h2>Help is on the way.</h2>
  <p>Stay here — someone's coming.</p>
</div>

<script>
  // ---- CONFIG: fill these in ----
  const BASE_ID = "YOUR_BASE_ID";              // e.g. app1234567890abcd
  const TOKEN = "YOUR_PERSONAL_ACCESS_TOKEN";  // Airtable personal access token
  const TABLE_NAME = "Alerts";
  const VENUE_NAME = "Test Venue";             // set per venue for now

  // Location comes from the URL, e.g. index.html?loc=Cubicle%201
  const params = new URLSearchParams(window.location.search);
  const LOCATION = params.get("loc") || "Unknown Location";

  let selectedType = null;

  function selectType(btn, type) {
    document.querySelectorAll(".btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    selectedType = type;
    document.getElementById("send-btn").disabled = false;
  }

  async function sendAlert() {
    if (!selectedType) return;

    const sendBtn = document.getElementById("send-btn");
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending...";
    document.getElementById("error").style.display = "none";

    const note = document.getElementById("note").value.trim();

    try {
      const fields = {
        "Venue": VENUE_NAME,
        "Location": LOCATION,
        "Alert Type": selectedType,
        "Status": "New"
      };
      if (note) fields["Notes"] = note;

      const response = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}`, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${TOKEN}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ records: [{ fields }] })
      });

      if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        throw new Error(errData?.error?.message || "Request failed");
      }

      document.getElementById("main-view").style.display = "none";
      document.getElementById("confirmation").style.display = "block";

    } catch (err) {
      sendBtn.disabled = false;
      sendBtn.textContent = "Send alert";
      const errorDiv = document.getElementById("error");
      errorDiv.textContent = "Something went wrong. Please find a staff member directly.";
      errorDiv.style.display = "block";
    }
  }
</script>

</body>
</html>
